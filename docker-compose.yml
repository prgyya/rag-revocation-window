services:
  postgres:
    # Pin the exact version you ran the final experiments with (see CHANGES.md, step 3)
    image: postgres:16.15
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragstudy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rag -d ragstudy"]
      interval: 2s
      retries: 30

  qdrant:
    # Pin the exact version you ran the final experiments with (see CHANGES.md, step 3)
    image: qdrant/qdrant:v1.20.0
    container_name: rag_qdrant
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"     # isolated test environment: no usage data leaves the machine
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
